<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Growth Accelerator - Payment</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
    .pay-btn { background: #16a34a; margin-top: 15px; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 6px; font-weight: bold;}
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>Career Growth Accelerator</h2>
  <p>Fee: <strong>₹400</strong></p>

  <form id="studentForm">
    <label>Full Name</label>
    <input type="text" id="name" required placeholder="John Doe">
    
    <label>Roll Number</label>
    <input type="text" id="roll" required placeholder="e.g. 21001A0501">

    <button type="submit">Proceed to Pay ₹400</button>
  </form>

  <div id="paymentSection" class="hidden">
    <p>Tap below to pay via GPay/PhonePe/Paytm. <strong>Do not edit the payment note</strong> so we can auto-verify your Roll Number.</p>
    <a id="upiLink" href="#" class="pay-btn">Pay via UPI App</a>
  </div>
</div>

<script>
  const UPI_ID = "yourupiid@okaxis"; // REPLACE WITH YOUR UPI ID
  const AMOUNT = "400.00";

  document.getElementById('studentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const roll = document.getElementById('roll').value;
    const name = document.getElementById('name').value;

    // Construct precise UPI URL pre-filling amount and Roll Number in note (tn)
    const note = encodeURIComponent(`CGA-${roll}`);
    const upiUrl = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent("Career Accelerator")}&am=${AMOUNT}&cu=INR&tn=${note}`;

    document.getElementById('upiLink').setAttribute('href', upiUrl);
    document.getElementById('paymentSection').classList.remove('hidden');
    document.getElementById('studentForm').classList.add('hidden');
  });
</script>

</body>
</html>
