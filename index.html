<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Growth Accelerator - Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    :root {
      --primary: #4f46e5;      /* Indigo */
      --primary-hover: #4338ca;
      --success: #059669;        /* Emerald Green */
      --bg-slate: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid var(--border-color);
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
    }

    .price-badge {
      display: inline-block;
      background-color: #e0e7ff;
      color: var(--primary);
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #f1f5f9;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      background-color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      border: none;
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .status-message {
      text-align: center;
      padding: 20px;
      border-radius: 8px;
    }

    .status-message.success {
      background-color: #d1fae5;
      color: var(--success);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h2>Career Growth Accelerator</h2>
    <div class="price-badge">Registration Fee: ₹400</div>
  </div>

  <form id="studentForm">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" required placeholder="Enter your full name">
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="student@example.com">
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required placeholder="9876543210">
    </div>
    
    <div class="form-group">
      <label for="roll">Roll Number</label>
      <input type="text" id="roll" required placeholder="e.g., 21001A0501">
    </div>

    <button type="button" id="payBtn">Pay ₹400 via Razorpay</button>
  </form>

  <div id="successMessage" class="status-message success hidden">
    <h3>Payment Successful!</h3>
    <p>Your registration details have been saved successfully.</p>
  </div>
</div>

<script>
  // CONFIGURATION
  const RAZORPAY_KEY_ID = "YOUR_RAZORPAY_KEY_ID"; // Replace with your Razorpay Key ID
  const GOOGLE_SHEET_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; // Replace with Web App URL

  document.getElementById('payBtn').addEventListener('click', function(e) {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const roll = document.getElementById('roll').value.trim();

    if (!name || !email || !phone || !roll) {
      alert("Please fill in all details before proceeding.");
      return;
    }

    const options = {
      "key": RAZORPAY_KEY_ID,
      "amount": 40000, // Amount in paise (40000 paise = ₹400)
      "currency": "INR",
      "name": "Career Growth Accelerator",
      "description": "Registration Fee",
      "handler": function (response) {
        // Payment successful callback
        saveToGoogleSheet({
          name: name,
          email: email,
          phone: phone,
          roll: roll,
          payment_id: response.razorpay_payment_id
        });
      },
      "prefill": {
        "name": name,
        "email": email,
        "contact": phone
      },
      "theme": {
        "color": "#4f46e5"
      }
    };

    const rzp1 = new Razorpay(options);
    rzp1.open();
  });

  function saveToGoogleSheet(data) {
    fetch(GOOGLE_SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data)
    }).then(() => {
      document.getElementById('studentForm').classList.add('hidden');
      document.getElementById('successMessage').classList.remove('hidden');
    }).catch(error => {
      console.error('Error saving data:', error);
      alert('Payment successful, but failed to log registration data. Please contact support.');
    });
  }
</script>

</body>
</html>
