<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Growth Accelerator - Payment</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
    .pay-btn { background: #16a34a; margin-top: 15px; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 6px; font-weight: bold;}
    .qr-container { text-align: center; margin-top: 15px; }
    .qr-container img { width: 200px; height: 200px; margin-top: 10px; border: 1px solid #ddd; padding: 5px; border-radius: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>Career Growth Accelerator</h2>
  <p>Fee: <strong>₹400</strong></p>

  <form id="studentForm">
    <label>Full Name</label>
    <input type="text" id="name" required placeholder="John Doe">
    
    <label>Roll Number</label>
    <input type="text" id="roll" required placeholder="e.g. 21001A0501">

    <button type="submit">Proceed to Pay ₹400</button>
  </form>

  <div id="paymentSection" class="hidden">
    <!-- Desktop QR Code View -->
    <div class="qr-container">
      <p style="margin: 0; font-weight: bold;">Scan to Pay via GPay / PhonePe / Paytm:</p>
      <img id="qrImage" src="" alt="UPI QR Code">
    </div>

    <!-- Mobile Direct Button View -->
    <p style="font-size: 13px; color: #555; text-align: center; margin-top: 15px;">
      Or tap below if you are on a Mobile Phone:
    </p>
    <a id="upiLink" href="#" class="pay-btn">Open UPI App</a>
    
    <p style="font-size: 12px; color: #d97706; text-align: center; margin-top: 10px;">
      <strong>Important:</strong> Do not change the payment description/note in your app so we can verify your Roll Number!
    </p>
  </div>
</div>

<script>
  // 1. REPLACE THIS WITH YOUR REAL UPI ID (e.g. 9876543210@paytm or name@okaxis)
  const UPI_ID = "yourupiid@okaxis"; 
  const AMOUNT = "400.00";

  document.getElementById('studentForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const roll = document.getElementById('roll').value.trim();
    const name = document.getElementById('name').value.trim();

    // Create custom reference note
    const note = encodeURIComponent(`CGA-${roll}`);
    const payeeName = encodeURIComponent("Career Accelerator");

    // Standard UPI Intent Link
    const upiUrl = `upi://pay?pa=${UPI_ID}&pn=${payeeName}&am=${AMOUNT}&cu=INR&tn=${note}`;

    // Update the button link for Mobile users
    document.getElementById('upiLink').setAttribute('href', upiUrl);

    // Generate dynamic QR Code for Desktop users using quickchart.io API
    const qrApiUrl = `https://quickchart.io/qr?text=${encodeURIComponent(upiUrl)}&size=200`;
    document.getElementById('qrImage').setAttribute('src', qrApiUrl);

    // Show payment elements
    document.getElementById('paymentSection').classList.remove('hidden');
    document.getElementById('studentForm').classList.add('hidden');
  });
</script>

</body>
</html>
